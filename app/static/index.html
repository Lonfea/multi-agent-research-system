<!doctype html><html><head><meta charset="utf-8"><title>Research Control Room</title><style>body{font:15px system-ui;background:#0d1117;color:#e6edf3;margin:0}.wrap{max-width:1100px;margin:auto;padding:40px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:22px;margin:15px 0}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#fff;margin:6px 0}button{background:#8957e5;font-weight:700}.flow{display:flex;gap:8px;flex-wrap:wrap}.step{border:1px solid #8957e5;border-radius:20px;padding:8px 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}small{color:#8b949e}</style></head><body><div class="wrap"><h1>Multi-Agent Research Control Room</h1><p><small>Researcher → Writer → Fact Checker → Supervisor → Human</small></p><div class="flow"><span class="step">Researcher</span><span class="step">Writer</span><span class="step">Fact Checker</span><span class="step">Supervisor</span><span class="step">Human Gate</span></div><div class="card"><input id="topic" placeholder="Research topic"><button onclick="run()">Start research run</button><p id="status">Ready.</p></div><div class="card"><h3>Report</h3><div id="report">No run yet.</div><h3>Human decision</h3><textarea id="feedback" placeholder="Reviewer feedback"></textarea><div class="actions"><button onclick="decide(true)">Approve</button><button onclick="decide(false)">Reject</button></div></div></div><script>let id='';async function run(){status.innerText='Agents working…';let r=await fetch('/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value})});let d=await r.json();id=d.run_id||'';status.innerText=d.status||d.detail;report.innerText=d.report||''}async function decide(ok){if(!id)return;let r=await fetch('/runs/'+id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:ok,feedback:feedback.value})});let d=await r.json();status.innerText=d.status||d.detail}</script></body></html>
